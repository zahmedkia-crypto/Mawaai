# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# JDK / Toolchain (MT-021)
# ----------------------------------------------------------------------------
# This file used to hard-code `org.gradle.java.home=C:/Program Files/Android/
# Android Studio/jbr` to work around a corrupt JBR on one developer's Windows
# machine. That broke every non-Windows machine (and CI). The override has
# been moved out of the repo.
#
# If you need to pin a specific JDK locally (because Android Studio's bundled
# JBR is broken, or because you want to use a custom toolchain), DO NOT edit
# this file. Instead, set the property in your *user-level* Gradle properties:
#
#   Windows:  %USERPROFILE%\.gradle\gradle.properties
#   macOS:    ~/.gradle/gradle.properties
#   Linux:    ~/.gradle/gradle.properties
#
# Example contents:
#   org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
#
# See docs/dev-setup.md for the full developer-environment guide.
# ----------------------------------------------------------------------------

# Allow Gradle to find JDKs installed on the system (JAVA_HOME, IDEA's bundled
# JBR on each developer's box, /Library/Java/JavaVirtualMachines on macOS, etc.).
org.gradle.java.installations.auto-detect=true

# Allow Gradle's toolchain resolver to download a missing JDK on demand. This
# keeps CI runners minimal — no need to pre-provision an Android Studio JBR.
org.gradle.java.installations.auto-download=true
