[versions]
agp = "8.7.3"
kotlin = "2.1.0"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.7.0"
activityCompose = "1.8.2"
composeBom = "2024.02.00"
hilt = "2.53"
room = "2.6.1"
navigationCompose = "2.7.7"
workManager = "2.9.0"
coil = "2.5.0"
lottie = "6.3.0"
media3 = "1.2.1"
datastore = "1.0.0"
splashscreen = "1.0.1"
palette = "1.0.0"
accompanist = "0.34.0"
